# Rilascio da un tag `v*` (per esempio `v0.1.0`, uguale alla versione in Cargo.toml):
# - su Windows e Ubuntu gli stessi controlli di `cargo xtask check`, poi
#   `cargo xtask release`: build da zero (nessuna cache), mitigazioni lette
#   dall'eseguibile e prova con DLL finte accanto (Windows), elenco delle dipendenze
#   incluso (cargo auditable), SBOM CycloneDX del pacchetto dell'app, nessun dato locale
#   nell'eseguibile né nello SBOM;
# - un ultimo job, che non compila nulla, calcola SHA256SUMS, firma l'attestazione di
#   provenienza (OIDC, nessun token a lunga vita) e crea la release come bozza, da
#   pubblicare a mano dopo averla controllata.
# Solo l'ultimo job ha permessi di scrittura; le build hanno il token in sola lettura.
name: Rilascio

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: dist (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Librerie di sistema per eframe/egui con winit (X11 e Wayland) e per rfd (GTK 3).
      - name: Pacchetti di sistema (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # La toolchain (1.99.1 con rustfmt e clippy) la installa rustup da rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2,cargo-auditable@0.7.7,cargo-cyclonedx@0.5.9

      - name: cargo xtask check
        run: cargo xtask check

      - name: cargo xtask release
        run: cargo xtask release

      # Il tag deve corrispondere alla versione del pacchetto: lo zip ha la versione nel nome.
      - name: Versione del tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          ls -- "dist/lynkeus-searcher-${version}-"*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.cdx.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: bozza di release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # crea la bozza di release
      id-token: write # attestazione di provenienza con OIDC
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: SHA256SUMS
        working-directory: release
        run: sha256sum -- *.zip *.cdx.json > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Bozza di release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: >-
          gh release create "$TAG" --repo "$REPO" --draft --verify-tag
          --title "$TAG"
          --notes "Eseguibili non firmati: verificare l'hash con SHA256SUMS (vedi README)."
          release/*
