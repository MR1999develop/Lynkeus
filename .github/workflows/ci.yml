# Gli stessi controlli di `cargo xtask check` in locale, su Windows.
# Ubuntu è sospeso finché i test Linux non passano: per riattivarlo, rimettere
# ubuntu-latest nella matrice e il controllo nel ruleset di main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest] # ubuntu-latest sospeso
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Librerie di sistema per eframe/egui con winit (X11 e Wayland) e per rfd (GTK 3).
      - name: Pacchetti di sistema (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libgtk-3-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # La toolchain (1.99.1 con rustfmt e clippy) la installa rustup da rust-toolchain.toml.
      - name: Toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2

      - name: cargo xtask check
        run: cargo xtask check
