# Controllo quotidiano di advisory, licenze e sorgenti delle dipendenze:
# un advisory nuovo, o un'eccezione di deny.toml oltre la sua data di revisione, fa fallire
# il job anche senza modifiche al codice, e GitHub notifica il fallimento del workflow
# pianificato.
name: cargo deny (giornaliero)

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check
        run: cargo deny check

      # La toolchain la installa rustup da rust-toolchain.toml.
      - name: cargo xtask deny-review
        run: cargo xtask deny-review
