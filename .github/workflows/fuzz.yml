# Fuzzing pianificato dei parser propri (cargo-fuzz con libFuzzer, toolchain nightly,
# Ubuntu): ogni target di `fuzz/` per 5 minuti, ogni giorno, con tetto di memoria e di tempo
# per input. Un crash o un timeout fa fallire il job (GitHub notifica il fallimento del
# workflow pianificato); gli input che fanno fallire restano tra gli artefatti, da ridurre e
# trasformare in un test normale (fuzz/README.md).
name: Fuzzing (giornaliero)

on:
  schedule:
    - cron: "43 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-fuzz@0.13.2

      # Semi iniziali dai file di prova del repository, dove il formato coincide.
      - name: Corpus iniziale
        working-directory: fuzz
        run: |
          mkdir -p corpus/rtf corpus/doc_piece_table corpus/ppt_records
          find ../fixtures -name '*.rtf' -exec cp -- {} corpus/rtf/ \;
          find ../fixtures -name '*.doc' -exec cp -- {} corpus/doc_piece_table/ \;
          find ../fixtures -name '*.ppt' -exec cp -- {} corpus/ppt_records/ \;

      - name: cargo fuzz run (ogni target)
        working-directory: fuzz
        run: |
          set -euo pipefail
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=300 -rss_limit_mb=2048 -timeout=10
            echo "::endgroup::"
          done

      - name: Input che fanno fallire
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
