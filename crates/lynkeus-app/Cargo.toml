[package]
name = "lynkeus-app"
description = "Lynkeus Searcher: trova le parole che contengono un testo, in file e cartelle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "lynkeus_app"
path = "src/lib.rs"

[[bin]]
name = "lynkeus-searcher"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
directories.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
fluent-templates.workspace = true
lynkeus-core.workspace = true
lynkeus-engine.workspace = true
rfd.workspace = true
serde.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Non usato nel codice: attiva Wayland caricato a runtime e le decorazioni su GNOME.
winit.workspace = true

[lints]
workspace = true
