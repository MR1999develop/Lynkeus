[package]
name = "lynkeus-app"
description = "Lynkeus Searcher: trova le parole che contengono un testo, in file e cartelle."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "lynkeus_app"
path = "src/lib.rs"

[[bin]]
name = "lynkeus-searcher"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
directories.workspace = true
eframe.workspace = true
getrandom.workspace = true
egui.workspace = true
egui_extras.workspace = true
fluent-templates.workspace = true
lynkeus-core.workspace = true
lynkeus-engine.workspace = true
lynkeus-extract.workspace = true
rfd.workspace = true
serde.workspace = true
subtle.workspace = true
sys-locale.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true

# Icona, versione e manifest dell'eseguibile Windows (build.rs; altrove non fa nulla).
[build-dependencies]
winresource.workspace = true

[dev-dependencies]
arboard.workspace = true
egui_kittest.workspace = true
proptest.workspace = true
tempfile.workspace = true
zip.workspace = true

# Picco della memoria privata nelle misure del piano di test (`tests/prestazioni_interfaccia.rs`
# include `lynkeus-engine/tests/misura`).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus"] }

[target.'cfg(windows)'.dependencies]
opener.workspace = true
windows-sys.workspace = true
winreg.workspace = true

[target.'cfg(not(windows))'.dependencies]
rustix.workspace = true
zbus.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Non usato nel codice: attiva Wayland caricato a runtime e le decorazioni su GNOME.
winit.workspace = true

[lints]
workspace = true
