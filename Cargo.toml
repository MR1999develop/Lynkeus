[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"
authors = ["MR"]
publish = false

# Ogni crate li eredita con `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Un piccolo insieme di `pedantic`, scelto per i bug che evita più che per lo stile.
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
checked_conversions = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
match_same_arms = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"

# Le dipendenze condivise dei crate si dichiarano qui e si ereditano con `workspace = true`.
[workspace.dependencies]
# Crate del workspace.
lynkeus-core = { path = "crates/lynkeus-core" }
lynkeus-extract = { path = "crates/lynkeus-extract" }
lynkeus-engine = { path = "crates/lynkeus-engine" }

# Esterne.
anyhow = "1.0.104"
# Chiave della cache del testo estratto. `pure`: niente C né assembly da compilare (anche il
# controllo per Linux da Windows funziona senza compilatore C del target).
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
# Fogli di calcolo xlsx e ods (processo estrattore).
calamine = { version = "0.38.0", default-features = false }
chardetng = "1.0.0"
# CRC dell'intestazione delle voci della cache (già nell'albero tramite zip).
crc32fast = "1.5.4"
crossbeam-channel = "0.5.17"
# Cartella di configurazione della piattaforma (settings.toml).
directories = "6.0.0"
# Solo per i benchmark (dev-dependency), senza grafici né rayon.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Senza `default_fonts`: i font di egui includono Ubuntu-Light (licenza Ubuntu Font),
# fuori dall'allowlist. I font si caricano dal sistema (`platform`).
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    # Solo per ricordare la finestra (`persist_window`): le impostazioni vanno in settings.toml.
    "persistence",
    "system_fonts",
    "wayland",
    "wgpu",
    "x11",
] }
egui = { version = "0.37.0", default-features = false }
encoding_rs = "0.8.44"
# Tabella virtualizzata dei risultati.
egui_extras = { version = "0.37.0", default-features = false }
# Test dell'interfaccia per ruolo e nome accessibile, sull'app eframe vera.
egui_kittest = { version = "0.37.0", default-features = false, features = ["eframe"] }
fluent-templates = "0.15.1"
ignore = "0.4.34"
# Compressione delle voci della cache: solo il formato a blocchi, senza `unsafe`.
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
memchr = "2.8.3"
# Apre un file con il programma predefinito (ShellExecuteW) e lo mostra nella cartella
# (SHOpenFolderAndSelectItems). Solo su Windows: su Linux opener cercherebbe `xdg-open`
# per nome, quindi lì si usa il portale XDG con `zbus`.
opener = { version = "0.9.0", default-features = false, features = ["reveal"] }
# PDF (ADR 0002): versione bloccata, solo `legacy-crypto` per i PDF cifrati con password vuota.
pdf_oxide = { version = "=0.3.78", default-features = false, features = ["legacy-crypto"] }
# Messaggi del protocollo del processo estrattore (e della cache).
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# Solo per i test di proprietà (dev-dependency).
proptest = "1.12.0"
# XML di docx, pptx e ODF, senza DTD.
quick-xml = "0.42.0"
regex = "1.13.1"
# Limite di memoria (`RLIMIT_AS`) del processo estrattore su Linux.
rlimit = "0.11.0"
# Dialoghi nativi per scegliere cartelle e file; su Linux tramite il portale XDG (nessuna libreria GTK).
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }
serde = { version = "1.0.229", features = ["derive"] }
sys-locale = "0.3.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = { version = "1.1.8", default-features = false, features = ["parse", "display", "serde"] }
# NFC/NFD dei termini e tabella delle varianti accentate (lynkeus-core).
unicode-normalization = "0.1.26"
# API Win32 senza involucri, solo in `lynkeus-app/src/platform/windows_ffi.rs`: processo
# estrattore con CreateProcessW nel Job Object (limite di memoria per processo, che `win32job`
# non offre: experiments/jobobject/ESITI.md) e SetDefaultDllDirectories.
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
# Portale XDG OpenURI (OpenFile, OpenDirectory) su Linux: apre e mostra i file senza
# avviare programmi cercati per nome. Già nell'albero tramite AccessKit.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# Solo per le feature Linux che eframe attiverebbe con `winit/default`: Wayland caricato a
# runtime e decorazioni client su GNOME. `-notitle` evita `ab_glyph` → `ttf-parser`
# (RUSTSEC-2026-0192, non mantenuto): la barra c'è, senza il titolo scritto.
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }
# Archivi zip e contenitori docx, xlsx, pptx, ODF: solo deflate (gli stessi metodi di calamine).
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }

# `trim-paths` non è stabile in cargo 1.99.1: i percorsi locali li toglie
# `cargo xtask dist` con `--remap-path-prefix` calcolati al momento.
[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"

# Crate di dominio: un overflow aritmetico è un bug da fermare anche in release.
[profile.release.package.lynkeus-core]
overflow-checks = true
[profile.release.package.lynkeus-extract]
overflow-checks = true
